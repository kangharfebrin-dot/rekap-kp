{% extends 'base.html' %}

{% block title %}Login | Rekap KP{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-panel auth-card">
        <h1 class="gradient-text text-center">Rekap KP</h1>
        <p class="text-center text-muted">Silakan login untuk melanjutkan</p>
        
        <form id="loginForm" class="mt-4">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Masukkan password">
            </div>
            
            <div id="authAlert" class="alert hidden"></div>
            
            <button type="submit" class="btn btn-primary btn-block mt-4" id="loginBtn">Login</button>
            <button type="button" class="btn btn-outline btn-block mt-2" id="registerBtn">Daftar Baru</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
