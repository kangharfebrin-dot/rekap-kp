{% extends 'base.html' %}

{% block title %}Admin Panel | Rekap KP{% endblock %}

{% block content %}
<div class="glass-panel">
    <h2 class="section-title">👑 Admin Panel - Manajemen Pengguna</h2>
    
    <div class="table-responsive mt-4">
        <table class="table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Nama Lengkap</th>
                    <th>NIM</th>
                    <th>Perusahaan</th>
                    <th>Jml Kegiatan</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="adminUsersTbody">
                <!-- Loaded via JS -->
            </tbody>
        </table>
    </div>
    
    <hr class="divider mt-4">
    
    <h3 class="subsection-title mt-4" id="formUserTitle">➕ Tambah Pengguna Baru</h3>
    <form id="adminUserForm" class="grid-4 align-end mt-2">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="a_username" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Password (kosongkan jika tidak diubah)</label>
            <input type="password" id="a_password" class="form-control">
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="a_role" class="form-control">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div class="flex-row gap-2">
            <button type="submit" class="btn btn-primary" id="saveUserBtn">Simpan</button>
            <button type="button" class="btn btn-outline hidden" id="cancelUserEditBtn">Batal</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
