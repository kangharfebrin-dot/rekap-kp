<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Rekap KP</title>
    
    <link rel="manifest" href="static/manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="static/icons/icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">

    <!-- Firebase SDK v8 Compat -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">👑 Rekap KP - Admin</div>
        <div class="nav-user">
            <span id="userEmailDisplay">👤 Loading...</span>
            <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
        </div>
    </nav>

    <main class="container">
        <div class="glass-panel">
            <h2 class="section-title">Manajemen Pengguna</h2>
            
            <div class="table-responsive mt-4">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Nama Lengkap</th>
                            <th>NIM</th>
                            <th>Perusahaan</th>
                            <th>Jml Kegiatan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersTbody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
            
            <hr class="divider mt-4">
            
            <h3 class="subsection-title mt-4" id="formUserTitle">Pengaturan Hak Akses (Role)</h3>
            <p class="text-sm text-muted">Admin hanya bisa mengubah role pengguna yang sudah terdaftar. Menghapus akun dilakukan melalui Firebase Console.</p>
            <form id="adminUserForm" class="grid-4 align-end mt-2">
                <div class="form-group">
                    <label>Email Pengguna</label>
                    <input type="email" id="a_email" class="form-control" required disabled>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="a_role" class="form-control">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="flex-row gap-2">
                    <button type="submit" class="btn btn-primary" id="saveUserBtn" disabled>Update Role</button>
                    <button type="button" class="btn btn-outline hidden" id="cancelUserEditBtn">Batal</button>
                </div>
            </form>
        </div>
    </main>

    <script src="static/js/firebase-config.js"></script>
    <script src="static/js/admin.js"></script>
</body>
</html>
